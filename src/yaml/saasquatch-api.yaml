  /{tenant_alias}/referrals/moderate:
    post:
      summary: Moderate referrals
      deprecated: false
      description: >
        Moderates one or several referrals by either approving or denying.

        Moderation can apply to one side of a referral, the other side, or both
        sides (Referrer and Referred).

        When a referral is denied, the associated reward will be "cancelled".

        A referral can be moderated several times, subsequently cancelling and
        un-cancelling the associated reward or rewards, and can be done as long
        as the associated reward is `cancellable`.

        Some rewards such as the coupons automatically generated by Referral
        SaaSquatch into Stripe and Recurly are not `cancellable` and requests to
        change the moderation will error.
      operationId: moderateReferrals
      tags:
        - Referral
        - Classic Only
      parameters:
        - name: tenant_alias
          in: path
          description: >
            Tenant being referenced. E.g. `"aboih12h16t"` or
            `"test_abo912126tastastt"`
          required: true
          example: ''
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferralModerationBulkRequest'
      responses:
        '200':
          description: Success
          headers: {}
      security:
        - APIKey: []
      x-docs-anchor: moderate_referrals
