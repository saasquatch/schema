components:
  schemas:
    Account:
      required:
        - id
        - subscription
      properties:
        id:
          type: string
          description: Unique identifier for the account
          example: abc123
        subscription:
          $ref: '#/components/schemas/AccountSubscription'
        referral:
          $ref: '#/components/schemas/AccountReferral'
        currency:
          type: string
          description: >
            Default is `"USD"`. Otherwise use an ISO 4217 Standard currency code
            in uppercase.
          example: USD
      type: object
    AccountDiscount:
      description: Information about the account's discount, if any
      properties:
        accountId:
          type: string
          description: The account id
          example: SV0TYE5OWI11120144
        discountPercentage:
          type: integer
          description: >
            An integer representing the total discount percentage from the
            referral program.

            e.g. For 10% would return the number 10. `discountPercentage` =
            `referredDiscountPercent` + `referrerDiscountPercent`
          example: 10
        referredDiscountPercent:
          type: integer
          description: >
            An integer representing the discount percentage from being referred.

            This will only have a value if the account has a coupon/referral
            code already associated with it, or if `couponCode` was passed as an
            argument.
        referrerDiscountPercent:
          type: integer
          description: >-
            An integer representing the discount earned from referring other
            accounts.
        ratePlanId:
          type: string
          description: |
            **Zuora only** The Zuora rate plan ID used to apply the discount.
        discountId:
          type: string
          description: >
            **Braintree only** The Braintree discount ID used to apply the
            discount.
        referrerName:
          type: string
          description: >
            The first and last name of the referrer that referred the user or
            `null` if this account was not referred.
      type: object
    AccountSubscription:
      description: An object describing the current subscription for this account
      required:
        - status
      properties:
        status:
          type: string
          description: The status of the subscription.
          enum:
            - PAID
            - TRIAL
            - FREE
            - CANCELLED
          example: PAID
        billingIntervalType:
          type: string
          description: >-
            Type of billing interval. <br>Required when `status: PAID`. <br>Use
            a placeholder value of `DAY` for Referral SaaSquatch programs with
            non-CPA billing
          enum:
            - DAY
            - WEEK
            - MONTH
            - QUARTER
            - SEMI_ANNUAL
            - YEAR
          example: DAY
        billingIntervalValue:
          type: integer
          description: >-
            The value of billing interval. <br>Required when `status: PAID`.
            <br>Use a placeholder value of `1` for Referral SaaSquatch programs
            with non-CPA billing
          example: 1
        value:
          type: number
          format: double
          description: >-
            Dollar value of the subscription per renewal. <br>Required when
            `status: PAID`. <br>Use a placeholder value of `1` for Referral
            SaaSquatch programs with non-CPA billing
          example: 1
      type: object
    AccountReferral:
      description: Info about who referred this account. Use this on first signup.
      properties:
        code:
          type: string
          description: >
            The referral code of the person that referred this account. Use
            squatch.js autofill to retrieve this value from the tracking cookie
            on your checkout form.
          example: BOBTESTERSON
      type: object
    Code:
      description: >-
        A referral code, details of the person who it belongs to, and details of
        the reward it unlocks
      properties:
        code:
          type: string
          description: |
            The unique identifier for the code. E.g. "BOBTESTERSON"
          example: BOBTESTERSON
        dateCreated:
          type: integer
          description: The date the code was created.
          example: 1411600868797
        programId:
          description: The ID of the program that the provided code belongs to.
          type: string
          example: my-program-id
        referrerName:
          type: string
          description: |
            The name of the owner of this code. E.g. "Bob Testerson"
          example: Bob Testerson
        reward:
          $ref: '#/components/schemas/RewardTemplate'
      type: object
    CodeClassicReward:
      description: >-
        A referral code, details of the person who it belongs to, and details of
        the reward it unlocks
      properties:
        code:
          type: string
          description: |
            The unique identifier for the code. E.g. "BOBTESTERSON"
          example: BOBTESTERSON
        dateCreated:
          type: integer
          description: The date the code was created.
          example: 1411600868797
        programId:
          description: The ID of the program that the provided code belongs to.
          type: string
          example: my-program-id
        referrerName:
          type: string
          description: |
            The name of the owner of this code. E.g. "Bob Testerson"
          example: Bob Testerson
        reward:
          $ref: '#/components/schemas/ClassicRewardTemplate'
      type: object
    DiscountCode:
      description: Information about the coupon/referral code
      properties:
        couponCode:
          type: string
          description: The coupon/referral code
          example: BOBTESTERSON
        referrerName:
          type: string
          description: The full name of the referrer who owns this code.
          example: Bob Testerson
        discountPercentage:
          type: integer
          description: >
            An integer representing the discount percentage. e.g. For 10% would
            return the number 10.
          example: 10
        dateCreated:
          type: integer
          description: Timestamp - The coupon/referral code to look up
          example: 1377727546528
        ratePlanId:
          type: string
          description: Zuora only The Zuora rate plan ID used to apply this coupon.
        discountId:
          type: string
          description: Braintree only The Braintree discount ID used to apply this coupon.
          example: saasquatch_discount
      type: object
    RewardTemplate:
      description: Details of the reward that could be earned -- but *is not yet earned*.
      properties:
        type:
          type: string
          description: The type of reward.
          enum:
            - PCT_DISCOUNT
            - FUELTANK
            - CREDIT
            - INTENGRATION
          example: CREDIT
        unit:
          type: string
          description: >
            An identifier for the unit of the reward. E.g. "credit-in-cents",
            "freemb", "giftcard20", "tshirt", "freemonth". Only works with
            `CREDIT`
          example: cents
        credit:
          type: integer
          description: >
            The amount of credit that this referral code is valid for. e.g. for
            $20 this

            object would have credit=2000, unit="cents". Only works for `CREDIT`
          example: 2000
        discountPercent:
          type: integer
          description: >
            The percent discount that the referral code is valid for. E.g. "10"
            for "10%". Only works with `PCT_DISCOUNT`
        monthsDiscountIsValid:
          type: integer
          description: When this reward is set to expire.  Only works with `PCT_DISCOUNT`
        valueInCents:
          type: integer
          description: 'The value of the reward in cents. Works with: `INTEGRATION`'
        rewardDetails:
          type: string
          description: >-
            JSON object containing details about the reward. Works with:
            `INTEGRATION`
      type: object
      example:
        CREDIT:
          type: CREDIT
          unit: CENTS
          credit: 2500
        PCT_DISCOUNT:
          type: PCT_DISCOUNT
          discountPercent: 20
          unit: '%'
    ClassicRewardTemplate:
      description: |
        <span class="label">Classic Only</span>
        Details of the reward that could be earned -- but *is not yet earned*.
      properties:
        type:
          type: string
          description: The type of reward.
          enum:
            - PCT_DISCOUNT
            - FUELTANK
            - CREDIT
            - INTENGRATION
          example: CREDIT
        unit:
          type: string
          description: >
            An identifier for the unit of the reward. E.g. "credit-in-cents",
            "freemb", "giftcard20", "tshirt", "freemonth". Only works with
            `CREDIT`
          example: cents
        credit:
          type: integer
          description: >
            The amount of credit that this referral code is valid for. e.g. for
            $20 this

            object would have credit=2000, unit="cents". Only works for `CREDIT`
          example: 2000
        discountPercent:
          type: integer
          description: >
            The percent discount that the referral code is valid for. E.g. "10"
            for "10%". Only works with `PCT_DISCOUNT`
        monthsDiscountIsValid:
          type: integer
          description: When this reward is set to expire.  Only works with `PCT_DISCOUNT`
        valueInCents:
          type: integer
          description: 'The value of the reward in cents. Works with: `INTEGRATION`'
        rewardDetails:
          type: string
          description: >-
            JSON object containing details about the reward. Works with:
            `INTEGRATION`
      type: object
      example:
        CREDIT:
          type: CREDIT
          unit: CENTS
          credit: 2500
        PCT_DISCOUNT:
          type: PCT_DISCOUNT
          discountPercent: 20
          unit: '%'
    NewReward:
      description: Details of a new reward to create.
      properties:
        type:
          type: string
          description: The type of reward.
          enum:
            - PCT_DISCOUNT
            - CREDIT
            - FUELTANK
          example: PCT_DISCOUNT
        dateExpires:
          type: integer
          description: Timestamp of when this reward is set to expire.
          example: 1471028988000
        dateScheduledFor:
          type: integer
          description: Timestamp of when the reward is sheduled to become available.
        cancellable:
          type: boolean
          description: >-
            If a reward is cancellable then it may be revoked. If it has been
            cancelled then dateCancelled will be non-null.
          example: true
        unit:
          type: string
          description: >-
            An identifier for the unit of the reward. E.g. `'credit-in-cents'`,
            `'freemb'`, `'giftcard20'`, `'tshirt'`, `'freemonth'` or `'%'`.
            Works with: `CREDIT`
        discountPercent:
          type: integer
          description: 'The percent discount. E.g. 10 means 10% Works with: `PCT_DISCOUNT`'
          example: 15
        assignedCredit:
          type: integer
          description: 'The earned quantity of the reward. Works with: `CREDIT`'
        currency:
          type: string
          description: 'For programs that require a currency. Works with: `CREDIT`'
        fuelTankType:
          type: string
          description: >-
            The type of reward associated with this fueltank code. Works with:
            `FUELTANK`
          enum:
            - PCT_DISCOUNT
            - CREDIT
        fuelTankCode:
          type: string
          description: >-
            The fueltank code associated with this reward. Works with:
            `FUELTANK`.
        amount:
          type: integer
          description: 'The earned quantity of the reward. Works with: `FUELTANK`'
      type: object
    RewardList:
      type: object
      description: A list of Reward objects as `rewards`
      properties:
        rewards:
          type: array
          description: >-
            A list of Reward objects. This is the actual data in this list
            envelope.
          items:
            $ref: '#/components/schemas/Reward'
    Reward:
      title: A Reward object.
      description: >-
        Rewards are used in SaaSquatch to track the credits, discounts, gift
        cards and other prizes that a User earns.
      properties:
        id:
          type: string
          description: The unique identifier for this reward
        type:
          type: string
          description: The type of reward.
          enum:
            - PCT_DISCOUNT
            - CREDIT
            - FUELTANK
        dateGiven:
          type: integer
          description: Timestamp of when this reward was earned.
        dateExpires:
          type: integer
          description: Timestamp of when this reward is set to expire.
        dateCancelled:
          type: integer
          description: >-
            Timestamp if the reward is cancellable and has been cancelled, the
            date it was cancelled on. Null if not never cancelled.
        dateScheduledFor:
          type: integer
          description: Timestamp of when the reward is sheduled to become available.
        cancellable:
          type: boolean
          description: >-
            If a reward is cancellable then it may be revoked. If it has been
            cancelled then `dateCancelled` will be non-null.
        rewardSource:
          type: string
          description: The type of the source of the reward.
          enum:
            - FRIEND_SIGNUP
            - REFERRED
            - MANUAL
        unit:
          type: string
          description: >-
            An identifier for the unit of the reward. E.g. `'credit-in-cents'`,
            `'freemb'`, `'giftcard20'`, `'tshirt'`, `'freemonth'` or `'%'`
        discountPercent:
          type: integer
          description: 'The percent discount. E.g. 10 means 10% Works with: `PCT_DISCOUNT`'
        name:
          type: string
          description: The human-readable name of the reward.
        description:
          type: string
          description: >-
            The human-readable description of the reward. Works with:
            `INTEGRATION`
        assignedCredit:
          type: integer
          description: 'The earned quantity of the reward. Works with: `CREDIT`'
        redeemedCredit:
          type: integer
          description: 'The redeemed quantity of the reward. Works with: `CREDIT`'
        redemptions:
          type: array
          items:
            $ref: '#/components/schemas/Redemption'
        currency:
          type: string
          description: 'For programs that require a currency. Works with: `CREDIT`'
        amount:
          type: integer
          description: 'The earned quantity of the reward. Works with: `FUELTANK`'
        fuelTankCode:
          type: string
          description: >-
            The fueltank code associated with this reward. Works with:
            `FUELTANK`
        fueltankType:
          type: string
          description: >-
            The type of reward associated with this fueltank code. Works with:
            `FUELTANK`
          enum:
            - PCT_DISCOUNT
            - CREDIT
      type: object
      example:
        PCT_DISCOUNT:
          id: 5462600de4b09b1c41108f2e
          type: PCT_DISCOUNT
          dateGiven: 1415733261275
          dateExpires: null
          dateCancelled: null
          accountId: '613611'
          userId: '876343'
          cancellable: true
          rewardSource: REFERRED
          discountPercent: 20
          unit: '%'
        CREDIT:
          id: 582142aae4b05442a5fa01a5
          type: CREDIT
          dateGiven: 1478574762838
          dateExpires: null
          dateCancelled: null
          dateScheduledFor: null
          accountId: '613611'
          userId: '876343'
          cancellable: true
          rewardSource: REFERRED
          unit: CENTS
          assignedCredit: 2500
          redeemedCredit: 0
          redemptions:
            - $ref: '#/components/schemas/Redemption/example'
          name: Dollar Credit
          currency: null
        FUELTANK:
          id: 12345678e4b1234aff143be5
          type: FUELTANK
          dateGiven: 1497907329060
          dateExpires: null
          dateCancelled: null
          accountId: abc_122
          userId: abc_122
          cancellable: true
          rewardSource: FRIEND_SIGNUP
          fuelTankCode: CODE8
          unit: CENTS
          amount: 1000
          fueltankType: CREDIT
    Redemption:
      title: A redemption object
      description: >-
        Details about when a quantity of a reward was redeemed from the
        SaaSquatch system.
      properties:
        id:
          type: string
          description: The unique identifier for this redemption
          example: 5462600de4b09b1c41238f2f
        dateRedeemed:
          type: integer
          description: Timestamp of when this redemption took place.
          example: 1415733261275
        quantityRedeemed:
          type: integer
          description: the amount of the reward that was redeemed.
          example: null
      type: object
      example:
        id: 5462600de4b09b1c41238f2f
        dateRedeemed: 1415733261275
        quantityRedeemed: 2000
    UserStub:
      title: A User object stub
      description: >-
        The basic information about a User used when you want to create a new
        user, called a UserStub.
      required:
        - id
        - accountId
      properties:
        id:
          type: string
          description: The unique identifier provided for this user.
          example: '219065'
        accountId:
          type: string
          description: The unique identifier of the Account that this user belongs to.
          example: accc9065
        referralCode:
          type: string
          description: The referral code *used for sharing by this user*
          example: BOBTESTERSON
        email:
          type: string
          description: >-
            The email address provided for the user. SaaSquatch uses this to
            notify someone when they have a successful referral.
          example: bob@example.com
        imageUrl:
          type: string
          description: >
            Optionally used in widgets, emails, and themes. If you provide a
            absolute profile image URL the minimum image size is 80px x 80px.
          example: https://www.example.com/profiled/ab5111251125
        firstName:
          type: string
          description: |
            The user's first name
          example: Bob
        lastName:
          type: string
          description: |
            The user's last name
          example: Testerson
        locale:
          type: string
          description: >
            The user's locale, used for
            [Internationalization](/themes/internationalization). The locale
            must be of the format 'language_COUNTRY' where the language code
            must be lowercase and the country code must be uppercase. The
            separator must be an underscore.
          example: '`en` or `en_US` or `zh_CN`'
      type: object
      example:
        id: '898746321'
        accountId: '987321'
        email: hello@example.com
        firstName: Henk
        lastName: Thompson
        referralCode: HENKTHOMPSON
        imageUrl: ''
        locale: null
    User:
      title: The User object
      description: >-
        An object describing an individual user. Users are used in SaaSquatch to
        track people/contacts/leads. When a referral happens, it always happens
        between two Users.
      required:
        - id
        - accountId
        - firstName
      properties:
        id:
          type: string
          description: The unique identifier provided for this user.
          example: '219065'
        accountId:
          type: string
          description: The unique identifier of the Account that this user belongs to.
          example: accc9065
        referralCode:
          type: string
          description: The referral code *used for sharing by this user*
          example: BOBTESTERSON
        email:
          type: string
          description: >-
            The email address provided for the user. SaaSquatch uses this to
            notify someone when they have a successful referral.
          example: bob@example.com
        imageUrl:
          type: string
          description: >
            Optionally used in widgets, emails, and themes. If you provide a
            absolute profile image URL the minimum image size is 80px x 80px.
          example: https://www.example.com/profiled/ab5111251125
        firstName:
          type: string
          description: |
            The user's first name
          example: Bob
        lastName:
          type: string
          description: |
            The user's last name
          example: Testerson
        firstSeenIP:
          type: string
          readOnly: true
          description: |
            The user's IP address on indentification
          example: 10.230.163.157
        lastSeenIP:
          type: string
          readOnly: true
          description: |
            The user's last known IP address
          example: 184.66.242.57
        dateCreated:
          type: integer
          readOnly: true
          description: |
            The Unix time stamp of when the user was created
          example: 1467222395030
        emailHash:
          type: string
          readOnly: true
          description: |
            The hash of the user's email address
          example: 180bc1412a038746af9b37fb782724a2
        referralSource:
          type: string
          readOnly: true
          description: |
            The domain from which the user was registered
          example: http://unifiedtestapp.herokuapp.com/
        locale:
          type: string
          description: >
            The user's locale, used for
            [Internationalization](/themes/internationalization). The locale
            must be of the format 'language_COUNTRY' where the language code
            must be lowercase and the country code must be uppercase. The
            separator must be an underscore.
          example: '`en` or `en_US` or `zh_CN`'
        shareLinks:
          $ref: '#/components/schemas/Sharelink'
      type: object
      example:
        id: '898746321'
        accountId: '987321'
        email: hello@example.com
        firstName: Henk
        lastName: Thompson
        referralCode: HENKTHOMPSON
        imageUrl: ''
        firstSeenIP: 10.230.163.157
        lastSeenIP: 184.66.242.57
        dateCreated: 1467222395030
        emailHash: 180bc1412a038746af9b37fb782724a2
        referralSource: http://unifiedtestapp.herokuapp.com/
        locale: null
        shareLinks:
          $ref: '#/components/schemas/Sharelink/example'
    UserPII:
      title: The User object
      description: >-
        An object containing the PII stored in the SaaSquatch system for a
        specific SaaSquatch user.
      required:
        - id
        - accountId
        - firstName
      properties:
        id:
          type: string
          description: The unique identifier provided for this user.
          example: '219065'
        accountId:
          type: string
          description: The unique identifier of the Account that this user belongs to.
          example: accc9065
        firstName:
          type: string
          description: |
            The user's first name
          example: Bob
        lastName:
          type: string
          description: |
            The user's last name
          example: Testerson
        lastInitial:
          type: string
          description: |
            The user's last name initial
          example: T
        referralCode:
          type: string
          description: The referral code *used for sharing by this user*
          example: BOBTESTERSON
        imageUrl:
          type: string
          description: >
            Optionally used in widgets, emails, and themes. If you provide a
            absolute profile image URL the minimum image size is 80px x 80px.
          example: https://www.example.com/profiled/ab5111251125
        email:
          type: string
          description: >-
            The email address provided for the user. SaaSquatch uses this to
            notify someone when they have a successful referral.
          example: bob@example.com
        cookieId:
          type: string
          description: A unique identifier for this participant.
          example: '2523423436323'
        paymentProviderId:
          type: string
          description: >-
            The paymentProviderId is either the Stripe Customer ID, the Recurly
            Account ID, the Braintree Account ID or the Zuora Account ID. This
            field cannot be updated. Do not include this arguement on an
            API-only program, or unless looking to set it.
          example: cus_8rVOAthabctvT6
        locale:
          type: string
          description: >
            The user's locale, used for
            [Internationalization](/themes/internationalization). The locale
            must be of the format 'language_COUNTRY' where the language code
            must be lowercase and the country code must be uppercase. The
            separator must be an underscore.
          example: '`en` or `en_US` or `zh_CN`'
        referable:
          type: boolean
          description: >-
            Flag used by the SaaSquatch system to determine whether a user is
            able to be referred.
          example: true
        customFields:
          type: object
          description: >
            An object containing the custom fields for this user.


            Learn more about the available custom field functionality in our
            [Custom Fields Developer Guide](/features/custom-user-fields)
          properties: {}
        firstSeenIP:
          type: string
          readOnly: true
          description: |
            The user's IP address on indentification
          example: 10.230.163.157
        lastSeenIP:
          type: string
          readOnly: true
          description: |
            The user's last known IP address
          example: 184.66.242.57
        firstSeenIPLocation:
          properties:
            lat:
              type: number
              format: float
              description: |
                The latitude of the user's first seen IP address
              example: 48.4765
            lon:
              type: number
              format: float
              description: |
                The longitude of the user's first seen IP address
              example: -123.3145
          type: object
        lastSeenIPLocation:
          properties:
            lat:
              type: number
              format: float
              description: |
                The latitude of the user's last known IP address
              example: 48.4765
            lon:
              type: number
              format: float
              description: |
                The longitude of the user's last known IP address
              example: -123.3145
          type: object
        firstSeenUserAgent:
          type: string
          readOnly: true
          description: |
            The user's browser user agent on indentification
          example: >-
            Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like
            Gecko) Chrome/65.0.3325.146 Safari/537.36
        lastSeenUserAgent:
          type: string
          readOnly: true
          description: |
            The latest user agent seen for the user
          example: >-
            Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like
            Gecko) Chrome/65.0.3325.146 Safari/537.36
        dateCreated:
          type: integer
          readOnly: true
          description: |
            The Unix time stamp of when the user was created
          example: 1467222395030
        emailHash:
          type: string
          readOnly: true
          description: |
            The hash of the user's email address
          example: 180bc1412a038746af9b37fb782724a2
        referralSource:
          type: string
          readOnly: true
          description: |
            The domain from which the user was registered
