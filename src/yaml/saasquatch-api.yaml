          required: true
          example: ''
          schema:
            type: string
        - name: userId
          in: path
          description: Filters share urls by `user.id`.
          required: true
          example: ''
          schema:
            type: string
        - name: engagementMedium
          in: query
          description: Filters share urls by `engagementMedium`.
          required: false
          schema:
            type: string
        - name: shareMedium
          in: query
          description: Filters share urls by `shareMedium`.
          required: false
          schema:
            type: string
        - name: programId
          in: query
          description: The ID of the program
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of share urls
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shareurls'
              example:
                $ref: '#/components/schemas/Shareurls/example'
          headers: {}
        '404':
