                warehouse. Works with reports of type `USER`, `USER_REFERRAL`,
                `REFERRAL`.
              type: integer
              format: int64
              example: 1471486452087
            programId:
              description: >
                The ID of the program that each user's sharelinks and referral
                code should be populated from. Works with reports of type
                `USER`, `USER_REFERRAL`, `REFERRAL`.
              type: string
              example: my-program-id
            filter:
              description: >
                A filter that defines the rewards to be exported. See GraphQL
                RewardFilterInput. Works with reports of type `REWARD`.
