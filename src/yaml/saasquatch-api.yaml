      summary: List referrals
      deprecated: false
      description: >
        List all of the referrals in your Referral SaaSquatch tenant. This
        method is the primary way of getting a full list of everyone that has
        made a referral and everyone that has been referred,

        and supports pagination using the parameters for `limit` and `offset` to
        iterate through a very large list of records.

        You can also use the query parameters for `referringAccountId` and
        `referringUserId` to filters this list of referrals to only include
        those made by a given user.
      operationId: listReferrals
      tags:
        - Referral
      parameters:
        - name: tenant_alias
          in: path
          description: >
            Tenant being referenced. E.g. `"aboih12h16t"` or
            `"test_abo912126tastastt"`
          required: true
          example: ''
          schema:
            type: string
        - name: referringAccountId
          in: query
          description: >-
            When included, filters the results to only referrals that were
            referred users with this `AccountId`
          required: false
          schema:
            type: string
        - name: referringUserId
          in: query
          description: >-
            When included, filters the results to only referrals that were
            referred users with this `UserId`
          required: false
          schema:
            type: string
        - name: dateReferralPaid
          in: query
          description: >-
            When included, filters the results either to the exact timestamp if
            only one value is given, or a range if devided by a comma. I.E.
            0,123412451 gives all referrals that converted between 0 and
            123412451.
          required: false
          schema:
            type: string
        - name: dateReferralEnded
          in: query
          description: >-
            When included, filters the results either to the exact timestamp if
            only one value is given, or a range if devided by a comma. I.E.
            0,123412451 gives all referrals that ended between 0 and 123412451.
          required: false
          schema:
            type: string
        - name: referredModerationStatus
          in: query
          description: >-
            When included, filters the result to only include referred users
            with that status. Statuses that are accepted: `PENDING`, `APPROVED`
            or `DENIED`.
          required: false
          schema:
            type: string
        - name: referrerModerationStatus
          in: query
          description: >-
            When included, filters the result to only include referrers with
            that status. Statuses that are accepted: `PENDING`, `APPROVED` or
            `DENIED`.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: A limit on the number of results returned. Defaults to `10`.
          required: false
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          description: >-
            When included offsets the first result returns in the list. Use this
            to paginate through a long list of results. Defaults to `0`
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A list of referrals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralList'
              example:
                count: 2
                totalCount: 4
                referrals:
                  - id: 5462600de4b09b1c41108f28
                    referredUser:
                      $ref: '#/components/schemas/User/example'
                    referrerUser:
                      $ref: '#/components/schemas/User/example'
                    referredReward:
                      $ref: '#/components/schemas/Reward/example/PCT_DISCOUNT'
                    referrerReward: null
                    referralCodeUsed: LORETTABURKE10
                    shareLinkUsed: http://ssqt.co/mPbcF5
                    moderationStatus: ACTIONED
                    dateReferralStarted: 1415733261238
                    dateReferralPaid: null
                    dateReferralEnded: null
                    dateModerated: 1427410131006
                    referredModerationStatus: APPROVED
                    referrerModerationStatus: APPROVED
                  - id: 546270a6e4b0c1871186a920
                    referredUser:
                      $ref: '#/components/schemas/User/example'
                    referrerUser:
                      $ref: '#/components/schemas/User/example'
                    referredReward:
                      $ref: '#/components/schemas/Reward/example/PCT_DISCOUNT'
                    referrerReward:
                      $ref: '#/components/schemas/Reward/example/PCT_DISCOUNT'
                    referralCodeUsed: FREE
                    sharelinkUsed: http://example.com/free?mn
                    moderationStatus: ACTIONED
                    dateReferralStarted: 1415737510411
                    dateReferralPaid: 1415737557217
                    dateReferralEnded: null
                    dateModerated: 1427410131029
                    referredModerationStatus: APPROVED
                    referrerModerationStatus: APPROVED
                    fraudSignals:
                      ip:
                        message: Referrer and referred came from the same IP
                        score: 50
          headers: {}
      security:
        - APIKey: []
      x-docs-anchor: list_referrals
