              format: int64
              example: 1471486452087
            fields:
              description: Settings related to the fields included in the exports
              type: object
              properties:
                includeUserStatsFields:
                  description: >-
                    Whether user stats fields should be included. Works with
                    reports of type `USER`.
                  type: boolean
                  default: false
                includeUserFields:
                  description: >-
                    Whether user fields should be included. Works with reports
                    of type `REWARD`.
                  type: boolean
                  default: false
                includeReferralFields:
                  description: >-
                    Whether referrals fields should be included. Works with
                    reports of type `REWARD`.
                  type: boolean
                  default: false
      type: object
    Export:
      description: >-
        An Export lets you get your customer data out of your Referral
        SaaSquatch tenant. There are exports for returning Users, Referrals and
        Reward Balances.
      required:
        - type
      properties:
        type:
          description: The type of Export that's being requested.
          type: string
          enum:
            - USER
            - USER_REFERRAL
            - REFERRAL
            - USER_REWARD_BALANCE
            - REWARD_BALANCE
            - REWARD
          example: REFERRAL
        format:
          description: The format of the Export
          type: string
          default: CSV
          enum:
            - CSV
            - XLSX
          example: CSV
        name:
          description: >-
            A user-friendly name for this report. Useful for keeping track of
            which report is which.
          type: string
        requester:
          description: Detail on the service or user that requested this report.
          type: string
          example: Referral SaaSquatch for Salesforce
        params:
          description: >
            Filter parameters for limiting the types of results returned. When
            parameters are included, their are grouped by a logical "AND" so
            it's possible to create situations that return no results.
          type: object
          properties:
            createdSince:
              description: >
                Filters for results that have been **created since this date**.
                Works with reports of type `USER`, `USER_REFERRAL`, `REFERRAL`,
                `USER_REWARD_BALANCE`, `REWARD_BALANCE`.
              type: integer
              format: int64
            createdBefore:
              description: >
                Filters for results that have been **created before this date**.
                Works with reports of type `USER`, `USER_REFERRAL`, `REFERRAL`,
                `USER_REWARD_BALANCE`, `REWARD_BALANCE`.
              type: integer
              format: int64
            updatedSince:
              description: >
                Filters for results that have been **updated since this date**.
                Works with reports of type `USER`, `USER_REFERRAL`, `REFERRAL`.
              type: integer
              format: int64
            updatedBefore:
              description: >
                Filters for results that have been **updated before this date**.
                Works with reports of type `USER`, `USER_REFERRAL`, `REFERRAL`.
              type: integer
              format: int64
            createdOrUpdatedSince:
              description: >
                Filters for results that have been **created or updated since
                this date**. Useful for doing incremental exports into a data
                warehouse. Works with reports of type `USER`, `USER_REFERRAL`,
                `REFERRAL`.
              type: integer
              format: int64
              example: 1471486152087
            createdOrUpdatedBefore:
              description: >
                Filters for results that have been **created or updated before
                this date**. Useful for doing incremental exports into a data
                warehouse. Works with reports of type `USER`, `USER_REFERRAL`,
                `REFERRAL`.
              type: integer
              format: int64
              example: 1471486452087
            programId:
              description: >
                The ID of the program that each user's sharelinks and referral
                code should be populated from. Works with reports of type
                `USER`, `USER_REFERRAL`, `REFERRAL`.
              type: string
              example: my-program-id
            filter:
              description: >
                A filter that defines the rewards to be exported. See GraphQL
                RewardFilterInput. Works with reports of type `REWARD`.
              type: object
              properties: {}
            at:
              description: >
                An optional timestamp for exporting the rewards' states at a
                specific point in time. Works with reports of type `REWARD`.
              type: integer
              format: int64
              example: 1471486452087
            fields:
              description: Settings related to the fields included in the exports
              type: object
              properties:
                includeUserStatsFields:
                  description: >-
                    Whether user stats fields should be included. Works with
                    reports of type `USER`.
                  type: boolean
                  default: false
                includeUserFields:
                  description: >-
                    Whether user fields should be included. Works with reports
                    of type `REWARD`.
                  type: boolean
                  default: false
                includeReferralFields:
                  description: >-
                    Whether referrals fields should be included. Works with
                    reports of type `REWARD`.
                  type: boolean
                  default: false
        id:
          description: >-
            A unique ID used to keep track of an export's life. Can be used to
            lookup an exports status.
          type: string
          readOnly: true
          example: 57b519f4e4b057c1b63925df
        status:
          description: >-
            The status of this export. `PENDING` while queued or running,
            `COMPLETED` when done, and `ABORTED` if there are unrecoverable
            errors.
          type: string
          readOnly: true
          enum:
            - PENDING
            - COMPLETED
            - ABORTED
            - EXPIRED
          example: PENDING
        dateCreated:
          description: >-
            The timestamp when this request was created. This field will never
            change.
          type: integer
          format: int64
          readOnly: true
          example: 1471486452362
        dateCompleted:
          description: >-
            The timestamp when this report finished processing and had it's
            `status` set to `COMPLETED`.
          type: integer
          format: int64
          readOnly: true
          example: 1474510479612
        dateExpires:
          description: >-
            The timestamp when this report will expire. By default all reports
            will eventually expire.
          type: integer
          format: int64
          readOnly: true
          example: 1471486479612
      type: object
    AccountDiscountRequest:
      required:
        - accountId
        - paymentProviderId
        - couponCode
      properties:
        accountId:
          type: string
          description: >
            Unique identifier for the account. We use this ID to link a group of
            users together. See [Shared vs Solo
            Accounts](/shared-vs-solo-accounts/) to see what you should use
            here.
          example: abc123
        paymentProviderId:
          type: string
          description: >
            The payment provider ID of the newly created account from Braintree
            or Zuora. This will be the Braintree Account ID or the Zuora Account
            ID of the newly created account.
          example: cus_123
        couponCode:
          type: string
          description: >
            The coupon/referral code of the user that referred this user. Can be
            obtained from the referral-tracking cookie using squatch.js coupon
            autofill.
          example: BOBTESTERSON
      type: object
    RewardDebitRequest:
      description: A request to debit a single reward
      required:
        - amount
        - unit
      properties:
        amount:
          type: integer
          description: The amount of credit to be debitted.
          example: 200
        unit:
          type: string
          description: |
            The type of credit to be debitted. E.g. "free-months" or "cents"
          example: cents
      type: object
    RewardBalanceDebitRequest:
      description: A request to debit a Reward Balance
      required:
        - accountId
        - unit
        - amount
      properties:
        accountId:
          type: string
          description: The ID of the account to be debitted.
          example: abc123
        unit:
          type: string
          description: |
            The type of credit to be debitted. E.g. "free-months" or "cents"
          example: cents
        amount:
          type: integer
          description: The amount of credit to be debitted.
          example: 200
      type: object
    ReferralModerationBulkRequest:
      description: A request to perform one or several moderation actions
      required:
        - actions
      properties:
        actions:
          type: array
          description: >-
            A list of individual moderation actions for specific referrals.
            Limited to a maximum of 100 actions per request
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReferralModerationRequest'
      type: object
    ReferralModerationRequest:
      description: A request to moderate a single referral
      required:
        - referralId
        - action
      properties:
        referralId:
          type: string
          description: The `id` of the Referral to be moderated
          example: 546270a6e4b0c1871186a920
        action:
          type: string
          description: The type of moderation action.
          enum:
            - APPROVED
            - DENIED
            - REFERRER_APPROVED
            - REFERRED_APPROVED
            - REFERRER_DENIED
            - REFERRED_DENIED
          example: REFERRED_DENIED
      type: object
    Error:
      properties:
        statusCode:
          description: The HTTP status code of the error
          type: integer
          format: int32
          example: 404
        message:
          description: >-
            The human-readable description of what went wrong. Use this to help
            you debug.
          type: string
        apiErrorCode:
          description: A machine error code
          type: string
      type: object
    VariablesError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            validationErrors:
              description: A list of validation errors
              type: array
              items:
                type: string
    GeneralError:
      $ref: '#/components/schemas/Error'
    VariablesErrorResponse:
      $ref: '#/components/schemas/VariablesError'
  responses: {}
  securitySchemes:
    APIKey:
      type: http
      description: >-
        Authorize your requests using a tenant's API Key. Use this method of
        security only in server-to-server interactions.
      scheme: basic
    UserJWT:
      type: apiKey
      in: header
      name: X-SaaSquatch-User-Token
      description: >-
        Authorize your requests using a JWT (JSON Web Token) for a given user.
        Useful for client-server authorization, such as the Mobile and Web SDKs.
        Used in Open Endpoints.
      x-scopes:
        - read
        - write
servers: []
security: []
