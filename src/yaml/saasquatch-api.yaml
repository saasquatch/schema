          description: >-
            The number of results returned in this list, see `totalCount` for
            all rows.
          example: 10
        totalCount:
          type: integer
          description: >-
            The total number of results available overall, see `count` for the
            number of rows in this list.
          example: 2415
      type: object
    ExportStub:
      description: >-
        An Export lets you get your customer data out of your Referral
        SaaSquatch tenant. There are exports for returning Users, Referrals and
        Reward Balances.
      required:
        - type
      properties:
        type:
          description: The type of Export that's being requested.
          type: string
          enum:
            - USER
            - USER_REFERRAL
            - REFERRAL
            - USER_REWARD_BALANCE
            - REWARD_BALANCE
            - REWARD
          example: REFERRAL
        format:
          description: The format of the Export
          type: string
          default: CSV
          enum:
            - CSV
            - XLSX
          example: CSV
        name:
          description: >-
            A user-friendly name for this report. Useful for keeping track of
            which report is which.
          type: string
        requester:
          description: Detail on the service or user that requested this report.
          type: string
          example: Referral SaaSquatch for Salesforce
        params:
          description: >
            Filter parameters for limiting the types of results returned. When
            parameters are included, their are grouped by a logical "AND" so
            it's possible to create situations that return no results.
          type: object
          properties:
            createdSince:
              description: >
                Filters for results that have been **created since this date**.
                Works with reports of type `USER`, `USER_REFERRAL`, `REFERRAL`,
                `USER_REWARD_BALANCE`, `REWARD_BALANCE`.
              type: integer
              format: int64
            createdBefore:
              description: >
                Filters for results that have been **created before this date**.
                Works with reports of type `USER`, `USER_REFERRAL`, `REFERRAL`,
                `USER_REWARD_BALANCE`, `REWARD_BALANCE`.
              type: integer
              format: int64
            updatedSince:
              description: >
                Filters for results that have been **updated since this date**.
                Works with reports of type `USER`, `USER_REFERRAL`, `REFERRAL`.
              type: integer
              format: int64
            updatedBefore:
              description: >
                Filters for results that have been **updated before this date**.
                Works with reports of type `USER`, `USER_REFERRAL`, `REFERRAL`.
              type: integer
              format: int64
            createdOrUpdatedSince:
              description: >
                Filters for results that have been **created or updated since
                this date**. Useful for doing incremental exports into a data
                warehouse. Works with reports of type `USER`, `USER_REFERRAL`,
                `REFERRAL`.
              type: integer
              format: int64
              example: 1471486152087
            createdOrUpdatedBefore:
              description: >
                Filters for results that have been **created or updated before
