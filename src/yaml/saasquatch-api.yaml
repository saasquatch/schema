openapi: 3.0.1
info:
  title: Advocate REST API
  description: >
    The SaaSquatch API is organized around REST. Our API is designed to have
    predictable, resource-oriented URLs and to use HTTP response codes to
    indicate API errors. We use built-in HTTP features, like HTTP authentication
    and HTTP verbs, which can be understood by off-the-shelf HTTP clients. JSON
    will be returned in all responses from the API, including errors.


    To make the SaaSquatch API as explorable as possible, accounts have
    test-mode API keys as well as live-mode API keys. These keys are both active
    at the same time. Data created with test-mode credentials will use your
    payment system's respective test mode.
  version: 1.0.0
tags:
  - name: Account
  - name: Classic Only
  - name: Deprecated
  - name: Open Endpoint
  - name: User
  - name: User Event
  - name: Modern Only
  - name: Share Links
  - name: Referral Code
  - name: Referral
  - name: Reward Balance
  - name: Reward
  - name: Webhook
  - name: Export
  - name: Theme
  - name: Discount
paths:
  /{tenant_alias}/accountsync:
    post:
      summary: Create or Update an account
      deprecated: true
      description: >
        Use this method to update SaaSquatch when the status of an account
        changes or when a new account is created.


        This call is only available on an API-only program. Making this call on
        a payment provider program will fail and return a 403 error indicating
        the call is incompatible with your type of program.
      operationId: upsertAccount
      tags:
        - Account
        - Classic Only
        - Deprecated
      parameters:
        - name: tenant_alias
          in: path
          description: >
            Tenant being referenced. E.g. `"aboih12h16t"` or
            `"test_abo912126tastastt"`
          required: true
          example: ''
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
      responses:
        '200':
          description: Account created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: a1234
                currency: USD
                subscription:
                  status: PAID
                  value: 1
                  billingIntervalType: DAY
                  billingIntervalValue: 1
                referral:
                  code: 3j033r
          headers: {}
        '403':
          description: Account sync failed
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                message: >-
                  Account sync failed. This push is not valid for your tenant
                  type[STRIPE]
                statusCode: 403
                apiErrorCode: API_REQUEST_NOT_SUPPORTED
          headers: {}
      security:
        - APIKey: []
      x-docs-anchor: account_sync
  /{tenant_alias}/account/{accountId}:
    get:
      summary: Lookup an account
      deprecated: false
      description: >
        Looks up an Account based upon `id` and returns the stored account
        information.

        This method just returns the details of the account in question, and not
        all associated properties like Rewards, ShareLinks, Balances or
        Referrals.


        This call is only available on an API-only program. Making this call on
        a payment provider program will fail and return a 403 error indicating
        the call is incompatible with your type of program.
      operationId: getAccount
      tags:
        - Account
        - Classic Only
      parameters:
        - name: accountId
          in: path
          description: The `id` of the Account to look up.
          required: true
          example: ''
          schema:
            type: string
        - name: tenant_alias
          in: path
          description: >
            Tenant being referenced. E.g. `"aboih12h16t"` or
            `"test_abo912126tastastt"`
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: '89842'
                subscription:
                  status: PAID
                  value: 29.99
                  billingIntervalType: MONTH
                  billingIntervalValue: 1
                referral:
                  code: WILLSANDERSON2
                currency: USD
          headers: {}
        '403':
          description: Account sync failed
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                message: >-
                  Account sync failed. This push is not valid for your tenant
                  type[STRIPE]
                statusCode: 403
                apiErrorCode: API_REQUEST_NOT_SUPPORTED
          headers: {}
        '404':
          description: Account NOT found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: {}
      security:
        - APIKey: []
      x-docs-anchor: get_account
  /{tenant_alias}/open/account/{accountId}:
    delete:
      summary: Delete an account
      deprecated: false
      description: >
        Delete an account in your SaaSquatch project. This endpoint will delete
        the account and all users on the account. Learn more about Accounts vs.
        Users in our article on [Account Structure](/shared-vs-solo-accounts/).


        To delete only a specific User on the Account use the [Delete User
        endpoint](#open_delete_user).


        Learn more about deleting participants within your SaaSquatch project in
        our article on [Participant Deletion](/features/participant-deletion)


        Include the `doNotTrack` query parameter as `true` to indicate to the
        SaaSquatch system that all currently-registered Users on this Account
        should not be able to be re-registered on the same Account. Learn more
        about `doNotTrack` in our article on [Participant
        Deletion](/features/participant-deletion)
      operationId: openDeleteAccount
      tags:
        - Account
        - Open Endpoint
      parameters:
        - name: tenant_alias
          in: path
          description: >
            Tenant being referenced. E.g. `"aboih12h16t"` or
            `"test_abo912126tastastt"`
          required: true
          example: ''
          schema:
            type: string
        - name: accountId
          in: path
          description: The ID of the account to be deleted
          required: true
          example: ''
          schema:
            type: string
        - name: doNotTrack
          in: query
          description: >-
            Do not track the user (this user cannot be re-registered in
            SaaSquatch). Learn more about `doNotTrack` in our article on
            [Participant Deletion](/features/participant-deletion)
          required: false
          schema:
            type: boolean
      responses:
        '204':
          description: Account successfully deleted
          headers: {}
        '404':
          description: No account found for the provided id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: {}
      security:
        - APIKey: []
      x-docs-anchor: open_delete_account
  /{tenant_alias}/user:
    post:
      summary: Create or Update a User
      deprecated: false
      description: >
        This method creates or updates a User object by performing an atomic
        upsert operation. Using this method will either replace the information
        stored about a given user, or

        create a new user if no User with a matching `id` is found. This method
        is helpful for synchronizing user information from your database into
        Referral SaaSquatch.

        This method will not create or update the Account linked by `accountId`.
        When creating users for the first time ensure that the Account already
        exists or create it before using this call.

        See the article on [Shared vs Solo Accounts](/shared-vs-solo-accounts/)
        for more information on Users and Accounts and how they relate.
      operationId: createUser
      tags:
        - User
        - Classic Only
      parameters:
        - name: tenant_alias
          in: path
          description: >
            Tenant being referenced. E.g. `"aboih12h16t"` or
            `"test_abo912126tastastt"`
          required: true
          example: ''
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStub'
            example:
              id: '898746321'
              accountId: '987321'
              email: hello@example.com
              firstName: Henk
              lastName: Thompson
              referralCode: HENKTHOMPSON
              imageUrl: ''
              locale: null
        required: true
      responses:
        '200':
          description: User Created or Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                $ref: '#/components/schemas/User/example'
          headers: {}
      security:
        - APIKey: []
      x-docs-anchor: create_user
    get:
      summary: Lookup a user by Referral Code
      deprecated: false
      description: >
        Looks up a user based upon their `referralCode` and returns their
        personal information.

        This method is useful for retrieving the user when only the Referral
        Code is available.

        For example when a referred user enters a Referral Code during checkout
        and you want to find out who this Referral Code belongs to.

        `referralCode` and `shareLinks` in the response are for the classic
        referral program.
      operationId: findUserByReferralCode
      tags:
        - User
        - Classic Only
      parameters:
        - name: tenant_alias
          in: path
          description: >
            Tenant being referenced. E.g. `"aboih12h16t"` or
            `"test_abo912126tastastt"`
          required: true
          example: ''
          schema:
            type: string
        - name: referralCode
          in: query
          description: >-
            The `referralCode` of the user you want to retrieve. For example
            BOBTESTERSON.
          required: true
          example: BOBTESTERSON
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                $ref: '#/components/schemas/User/example'
          headers: {}
        '404':
          description: User NOT found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: {}
      security:
        - APIKey: []
      x-docs-anchor: get_user_by_referralcode
  /{tenant_alias}/account/{accountId}/user/{userId}:
    get:
      summary: Lookup a user
      deprecated: false
      description: >
        Looks up a user based upon their `id` and returns their personal
        information.

        This method just returns the details of the user in question, and not
        all associated properties like Rewards, Balances, or Referrals.
      operationId: getUser
      tags:
        - User
        - Classic Only
      parameters:
        - name: accountId
          in: path
          description: >-
            The `id` of the Account that this user is a member of. See [Shared
            vs. Solo accounts](/shared-vs-solo-accounts/) for more info.
          required: true
          example: ''
          schema:
            type: string
        - name: userId
          in: path
          description: The `id` of the User to find
          required: true
          example: ''
          schema:
            type: string
        - name: tenant_alias
          in: path
          description: >
            Tenant being referenced. E.g. `"aboih12h16t"` or
            `"test_abo912126tastastt"`
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                $ref: '#/components/schemas/User/example'
          headers: {}
        '404':
          description: User NOT found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: {}
      security:
        - APIKey: []
      x-docs-anchor: get_user
  /{tenant_alias}/account/{accountId}/user/{userId}/pii:
    get:
      summary: Lookup a user PII
      deprecated: false
      description: >
        Returns details of the Personally identifiable information stored in the
        SaaSquatch system for a specific SaaSquatch user.


        > **Warning!** This method should only be used in connection with data
        protection and privacy compliance.

        >

        > For programatically looking up information about users within your
        SaaSquatch project, please use the [Lookup User
        endpoint](#open_get_user)
      operationId: getUserPII
      tags:
        - User
      parameters:
        - name: accountId
          in: path
          description: The `id` of the Account to lookup
          required: true
          example: ''
          schema:
            type: string
        - name: userId
          in: path
          description: The `id` of the User to lookup
          required: true
          example: ''
          schema:
            type: string
        - name: tenant_alias
          in: path
          description: >
            Tenant being referenced. E.g. `"aboih12h16t"` or
            `"test_abo912126tastastt"`
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPII'
              example:
                $ref: '#/components/schemas/UserPII/example'
          headers: {}
        '404':
          description: User NOT found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: {}
      security:
        - APIKey: []
      x-docs-anchor: get_user_pii
  /{tenant_alias}/account/{accountId}/user/{userId}/block:
    post:
      summary: Block user
      deprecated: false
      description: >
        Block a user from making successful referrals based upon their user and
        account `id`.

        More information about blocking users from participating in your
        referral program can be [found in the SaaSquatch
        docs](/developer/referral-security/#user-blocking).
      operationId: blockUser
      tags:
        - User
      parameters:
        - name: accountId
          in: path
          description: >-
            The `id` of the Account associated with the User being blocked. See
            [Shared vs. Solo accounts](/shared-vs-solo-accounts/) for more info.
          required: true
          example: ''
          schema:
            type: string
        - name: userId
          in: path
          description: The `id` of the User to block
          required: true
          example: ''
          schema:
            type: string
        - name: tenant_alias
          in: path
          description: >
            Tenant being referenced. E.g. `"aboih12h16t"` or
            `"test_abo912126tastastt"`
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: User blocked successfully
          content:
            application/json:
              schema: {}
              example: {}
          headers: {}
        '403':
          description: User already blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: {}
        '404':
          description: User/Account NOT found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: {}
      security:
        - APIKey: []
      x-docs-anchor: block_user
  /{tenant_alias}/account/{accountId}/user/{userId}/unblock:
    post:
      summary: Unblock user
      deprecated: false
      description: >
        Unblock a user based upon their user and account `id`.

        More information about blocking users from participating in your
        referral program can be [found in the SaaSquatch
        docs](/developer/referral-security/#user-blocking).
      operationId: unblockUser
      tags:
        - User
      parameters:
        - name: accountId
          in: path
          description: >-
            The `id` of the Account associated with the User being unblocked.
            See [Shared vs. Solo accounts](/shared-vs-solo-accounts/) for more
            info.
          required: true
          example: ''
          schema:
            type: string
        - name: userId
          in: path
          description: The `id` of the User to unblock
          required: true
          example: ''
          schema:
            type: string
        - name: tenant_alias
          in: path
          description: >
            Tenant being referenced. E.g. `"aboih12h16t"` or
            `"test_abo912126tastastt"`
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: User unblocked successfully
          content:
            application/json:
              schema: {}
              example: {}
          headers: {}
        '403':
          description: User not blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: {}
        '404':
          description: User/Account NOT found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: {}
      security:
        - APIKey: []
      x-docs-anchor: unblock_user
  /{tenant_alias}/users:
    get:
      summary: List users
      deprecated: false
      description: >
        List all of the Users in your Referral SaaSquatch tenant. This method is
        the primary way of getting a full list of everyone that has been
        identified through the API, Squatch.js or mobile widgets.

        This method supports pagination using the parameters for `limit` and
        `offset` to iterate through a very large list of records.

        You can also search for particular users using the `query` method. To
        find information about which users have completed referrals, use the
        [List referrals](#list_referrals) method.
      operationId: listUsers
      tags:
        - User
      parameters:
        - name: tenant_alias
          in: path
          description: >
            Tenant being referenced. E.g. `"aboih12h16t"` or
            `"test_abo912126tastastt"`
          required: true
          example: ''
          schema:
            type: string
        - name: query
          in: query
          description: >-
            A search query that can be used to filter users by email, name or
            ID.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: A limit on the number of results returned. Defaults to `10`.
          required: false
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          description: >-
            When included offsets the first result returns in the list. Use this
            to paginate through a long list of results. Defaults to `0`
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Users found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
              example:
                count: 1
                totalCount: 1
                users:
                  - id: '14125'
                    accountId: '89842'
                    email: mark@example.com
                    firstName: Mark
                    lastName: Testerson
                    referralCode: MARKTESTER
                    imageUrl: ''
                    dateCreated: 1414452680584
                    emailHash: a65a76ba72e5a0b1e6253efce357abb6
          headers: {}
      security:
        - APIKey: []
      x-docs-anchor: list_users
  /{tenant_alias}/open/account/{accountId}/user/{userId}:
    put:
      summary: User Upsert
      deprecated: false
      description: >
        This method updates/creates a user and an account and returns the user
        object representing that newly created user/account.


        You can provide vanity referral codes and sharelinks in a user upsert.
        Make sure to check the tenant setting
        `allowReferralCodeEditOnUserUpsert`, if it is set to `FALSE` then
        referral codes added when upserting an existing user will be ignored.
        New sharelinks and referral codes will be set as primary for the
        upserted user. If a referral code is passed without an associated
        sharelink for that program, then one will be generated and vice versa
        for sharelinks.


        Because this call creates a user, it requires either a [write
        token](../openendpoints/) or an API key.
      operationId: openUserUpsert
      tags:
        - User
        - Open Endpoint
      parameters:
        - name: accountId
          in: path
          description: The account to upsert
          required: true
          example: ''
          schema:
            type: string
        - name: userId
          in: path
          description: The user to upsert
          required: true
          example: ''
          schema:
            type: string
        - name: tenant_alias
          in: path
          description: >
            Tenant being referenced. E.g. `"aboih12h16t"` or
            `"test_abo912126tastastt"`
          required: true
          example: ''
          schema:
            type: string
        - name: fields
          in: query
          description: >
            The fields to be included in the response. Cannot coexist with
            `extraFields`. E.g. `"firstName,lastName,dateBlocked"`
          required: false
          schema:
            type: string
            default: null
        - name: extraFields
          in: query
          description: >
            The fields to be included in the response in addition to all the
            default fields. To select from default fields, use `fields`. Cannot
            coexist with `fields`. E.g. `"firstName,lastName,dateBlocked"`
          required: false
          schema:
            type: string
            default: null
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenUserStub'
      responses:
        '200':
          description: Information about the upserted user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenUser'
              example:
                $ref: '#/components/schemas/OpenUser/example'
          headers: {}
        '403':
          description: Endpoint disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: {}
      security:
        - APIKey: []
        - UserJWT: []
      x-docs-anchor: open_user_upsert
    post:
      summary: Create a user and account
      deprecated: false
      description: >
        This method creates a user and an account and returns the user object
        representing that newly created user/account.


        You can provide vanity referral codes and sharelinks when creating a
        user and account. Make sure to check the tenant setting
        `allowReferralCodeEditOnUserUpsert`, if it is set to `FALSE` then
        referral codes added when using this method on an existing user will be
        ignored. New sharelinks and referral codes will be set as primary for
        the given user. If a referral code is passed without an associated
        sharelink for that program, then one will be generated and vice versa
        for sharelinks.


        Because this call creates a user, it requires either a [write
        token](../openendpoints/) or an API key.
      operationId: openCreateUser
      tags:
        - User
        - Open Endpoint
      parameters:
        - name: accountId
          in: path
          description: The account to create
          required: true
          example: ''
          schema:
            type: string
        - name: userId
          in: path
          description: The user to create
          required: true
          example: ''
          schema:
            type: string
        - name: tenant_alias
          in: path
          description: >
            Tenant being referenced. E.g. `"aboih12h16t"` or
            `"test_abo912126tastastt"`
          required: true
          example: ''
          schema:
            type: string
        - name: fields
          in: query
          description: >
            The fields to be included in the response. Cannot coexist with
            `extraFields`. E.g. `"firstName,lastName,dateBlocked"`
          required: false
          schema:
            type: string
            default: null
        - name: extraFields
          in: query
          description: >
            The fields to be included in the response in addition to all the
            default fields. To select from default fields, use `fields`. Cannot
            coexist with `fields`. E.g. `"firstName,lastName,dateBlocked"`
          required: false
          schema:
            type: string
            default: null
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenUserStub'
      responses:
        '200':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: {}
        '201':
          description: Information about the newly created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenUser'
              example:
                $ref: '#/components/schemas/OpenUser/example'
          headers: {}
        '403':
          description: Endpoint disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: {}
      security:
        - APIKey: []
        - UserJWT: []
      x-docs-anchor: open_create_user
    get:
      summary: Lookup a user
      deprecated: false
      description: >
        Looks up a user based upon their `id` and returns their personal
        information including sharelinks. This endpoint requires a [read
        token](../openendpoints/) or an API key.


        This is an [Open Endpoint](../openendpoints/) and disabled by default.
        Contact support to enable the open endpoints.
      operationId: openGetUser
      tags:
        - User
        - Open Endpoint
      parameters:
        - name: accountId
          in: path
          description: A valid Account ID that a user is associated with
          required: true
          example: ''
          schema:
            type: string
        - name: userId
          in: path
          description: A valid User ID
          required: true
          example: ''
          schema:
            type: string
        - name: tenant_alias
          in: path
          description: >
            Tenant being referenced. E.g. `"aboih12h16t"` or
            `"test_abo912126tastastt"`
          required: true
          example: ''
          schema:
            type: string
        - name: fields
          in: query
          description: >
            The fields to be included in the response. Cannot coexist with
            `extraFields`. E.g. `"firstName,lastName,dateBlocked"`
          required: false
          schema:
            type: string
            default: null
        - name: extraFields
          in: query
          description: >
            The fields to be included in the response in addition to all the
            default fields. To select from default fields, use `fields`. Cannot
            coexist with `fields`. E.g. `"firstName,lastName,dateBlocked"`
          required: false
          schema:
            type: string
            default: null
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenUser'
