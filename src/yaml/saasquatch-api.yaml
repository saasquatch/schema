  /{tenant_alias}/open/account/{accountId}/user/{userId}/events:
    post:
      summary: Track User Event
      deprecated: false
      description: >
        This method can be used to track when users <a
        href="/developer/purchase-object/">make purchases</a>, download items,
        or take other meaningful actions that you want to use to trigger your
        programs.


        To prevent processing an event more than once, you can provide an
        idempotency

        key to achieve "at most once" processing semantics. The idempotency key

        uniquely identifies the event, and is generated by the caller.


        The idempotency key can be any string identifier that your system
        associates

        with the event, with the following restrictions:


        - It must be at least 8 characters long

        - It must be no more than 64 characters long

        - It can only contain alphanumerics characters, as well as the `.`, `-`,
          or `_` characters

        For example, a good choice for an idempotency key is a UUID, in
        particular

        a random version 4 UUID like `ec524601-975c-458a-9948-ae4448ce8944`.


        Idempotency keys are guaranteed to be stored by SaaSquatch for at least
        24 hours,

        such that any event inputs with the same idempotency key within 24 hours
        will

        be guaranteed to process the events only once.


        Subsequent attempts to process an event with an idempotency key that has
        already

        been processed once will result in an HTTP 409 Conflict response, so you
        will

        need to ensure that you are handling this status code in your request
        logic.
      operationId: trackEvent
      tags:
        - User Event
        - Open Endpoint
        - Modern Only
      parameters:
        - name: accountId
          in: path
          description: >-
            The `id` of the Account associated with the User being tracked. See
            [Shared vs. Solo accounts](/shared-vs-solo-accounts/) for more info.
          required: true
          example: ''
          schema:
            type: string
        - name: userId
          in: path
          description: The `id` of the User being tracked
          required: true
          example: ''
          schema:
            type: string
        - name: tenant_alias
          in: path
          description: >
            Tenant being referenced. E.g. `"aboih12h16t"` or
            `"test_abo912126tastastt"`
          required: true
          example: ''
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - accountId
                - events
              properties:
                userId:
                  description: The `id` of the User being tracked
                  type: string
                  example: someUserId
                accountId:
                  description: >-
                    The `id` of the Account associated with the User being
                    tracked. See [Shared vs. Solo
                    accounts](/shared-vs-solo-accounts/) for more info.
                  type: string
                  example: someAccountId
                idempotencyKey:
                  description: The idempotency key for the logged events
                  type: string
                  example: ec524601-975c-458a-9948-ae4448ce8944
                events:
                  description: An array of events
                  type: array
                  items:
                    type: object
                    description: Event Payload
                    required:
                      - key
                    properties:
                      key:
                        description: The unique name of the event
                        type: string
                        example: purchase
                      fields:
                        description: >
                          Additional fields about the event.

                          Strings longer than 1500 UTF-8 bytes are not
                          supported.

                          Arrays of arrays are not supported.
                        type: object
                        additionalProperties: true
                        properties: {}
                        example:
                          currency: CAD
                      dateTriggered:
                        description: The date the event was triggered
                        type: number
        required: true
      responses:
        '200':
          description: Event tracked
          content:
            application/json:
              schema: {}
              example:
                userId: someUserId
                accountId: someAccountId
                events:
                  - id: 5bb3978dbd8bfe821a5f26f3
                    key: purchase
                    fields:
                      currency: CAD
                    dateTriggered: 1538496397475
                    dateReceived: 1538496397475
                    dateProcessed: 1538496397479
          headers: {}
        '404':
          description: User/Account NOT found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: {}
        '409':
          description: Idempotency key conflict
          headers: {}
      security:
        - APIKey: []
        - UserJWT: []
      x-docs-anchor: trackEvent
  /{tenant_alias}/account/{accountId}/user/{userId}/sharelinks:
    get:
      summary: Lookup a user's share links
      deprecated: true
      description: >
        Gets the share links for a user. Share links are the links that people
        use to refer their friends and are the same links used in the Referral
        SaaSquatch widgets. The main

        use case for this method is to look up share links to include in other
        channels like email marketing, CRM and product integration when a widget
        or mobile webview can't be

        easily used. For example, one could write "Share this link with your
        friends, and get rewarded when they sign up" and include the share link
        looked up using this method.


        All share links work by dropping a tracking cookie when someone clicks
        the link and redirecting the new user to a landing page. This cookie
        includes the value of the

        referral code of the person that shared it. The cookie

        can be read using the `autofill` function of Squatch.js and is also
        passed along as the `rsCode` parameter in the redirect.

        For example `http://ssqt.co/pZVp` redirects to
        `https://www.google.ca/?rsCode=THIRDUSER`.


        There are many share links for each user, each one tagged with
        additional metadata for tracking the effectiveness of sharing channels.
        For example the `facebookShareLink` is used in the

        share on Facebook functionality of the widget. When people share on
        facebook using the widget that `facebookShareLink` will be posted on
        their wall so that when new people click on that

        link they will be tracked as a referral and attributed back to Facebook.
        Note that this does not necessarily guarantee tracking; the generic
        `shareLink` could simply be copied

        and pasted on to Facebook, and due to limitation on http referer
        information passed on by browsers, it may not be possible to determine
        which share medium a new sign up came from.


        In some cases it is preferable to have users share their referral code
        with friends instead of sharing their referral link. For example mobile
        apps and cookie blocking may prevent

        a share link from successfully tracking a referral, and having an input
        box for "Referral Code" on your product sign up form gets around these
        limitations and will ensure that more

        types of referrals can be tracked. Use the [Lookup a user API
        call](#get_user) to find a user's referral code.
      operationId: getSharelinks
      tags:
        - Share Links
        - Classic Only
        - Deprecated
      parameters:
        - name: tenant_alias
          in: path
          description: >
            Tenant being referenced. E.g. `"aboih12h16t"` or
            `"test_abo912126tastastt"`
          required: true
          example: ''
          schema:
            type: string
        - name: accountId
          in: path
          description: The ID of the account to look up
          required: true
          example: ''
          schema:
            type: string
        - name: userId
          in: path
          description: Filters share links by `user.id`.
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: A list of share links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sharelink'
              example:
                $ref: '#/components/schemas/Sharelink/example'
          headers: {}
        '404':
          description: User/Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: {}
      security:
        - APIKey: []
      x-docs-anchor: get_sharelinks
