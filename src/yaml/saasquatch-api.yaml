    RewardBalanceList:
      type: object
      description: A list of Reward Balance objects as `rewardBalances`
      properties:
        rewardBalances:
          type: array
          description: >-
            A list of Reward Balance objects. This is the actual data in this
            list envelope.
          items:
            $ref: '#/components/schemas/RewardBalance'
    RewardBalance:
      description: Details of the balance of several individual rewards.
      properties:
        type:
          type: string
          description: The type of reward.
          enum:
            - PCT_DISCOUNT
            - CREDIT
            - FUELTANK
          example: CREDIT
        unit:
          type: string
          description: >
            An identifier for the unit of the reward. E.g. "credit-in-cents",
            "freemb", "giftcard20", "tshirt", "freemonth". Only works with
            `CREDIT`
          example: cents
        count:
          type: integer
          description: >
            "The number of rewards earned. Usually is equal to the number of
            successful referrals made.

            E.g. An account has $80 of credit due to the referral program. $60
            from making referrals, $20 from being referred.

            The count would be 4 rewards, each worth $20. Only works for
            `CREDIT`"
        totalAssignedCredit:
          type: integer
          description: >-
            The total assignedCredit for all reward credits of the same unit
            type. Only works with types: `CREDIT`
          example: 4000
        totalRedeemedCredit:
          type: integer
          description: >-
            The total redeemedCredit for all reward credits of the same unit
            type. Only works with types: `CREDIT`
          example: 1490
        totalDiscountPercent:
          type: integer
          description: >-
            The total discountPercent from all rewards. Only works with types:
            `PCT_DISCOUNT`
        referredDiscountPercent:
          type: integer
          description: >-
            The total discountPercent from rewards with `rewardSource =
            REFERRED` Only works with types: `PCT_DISCOUNT`
        referrerDiscountPercent:
          type: integer
          description: >-
            The total discountPercent from rewards with `rewardSource =
            FRIEND_SIGNUP` Only works with types: `PCT_DISCOUNT`
        totalFuelTankCodes:
          type: integer
          description: >-
            The number of earned fueltank rewards. Only works with type:
            `FUELTANK`
      type: object
      example:
        CREDIT:
          type: CREDIT
          count: '4'
          totalAssignedCredit: '10000'
          totalRedeemedCredit: '0'
          unit: cents
        PCT_DISCOUNT:
          type: PCT_DISCOUNT
          totalDiscountPercent: '30'
          referredDiscountPercent: '10'
          referrerDiscountPercent: '20'
        FUELTANK:
          type: FUELTANK
          totalFuelTankCodes: 1
    Referral:
      description: >-
        A link between the user/account of the referrer and the new referred
        user/account. The authoritative source of who has referred whom. Not all
        referrals result in a Reward or a RewardBalance being created, such as
        in-progress referrals.
      properties:
        id:
          type: string
          description: Unique identifier for the Referral object
          example: abdsds5124abewet
        referredUser:
          $ref: '#/components/schemas/User'
        referrerUser:
          $ref: '#/components/schemas/User'
        referredReward:
          $ref: '#/components/schemas/Reward'
        referrerReward:
          $ref: '#/components/schemas/Reward'
        referralCodeUsed:
          type: string
          title: Referral Code Used
          description: The referrers code that was used by the referred for the referral.
        shareLinkUsed:
          type: string
          title: Share Link Used
          description: The sharelink that was used by the referred for the referral.
        moderationStatus:
          type: string
          description: >
            When referrals are manually managed, each referral has a `PENDING`
            state until it is explicitly moderated.
          enum:
            - PENDING
            - ACTIONED
          example: PENDING
        referredModerationStatus:
          type: string
          description: >
            Used to identify the *referred* user's moderation status and affect
            Reward cancellation.
          enum:
            - PENDING
            - APPROVED
            - DENIED
          example: PENDING
        referrerModerationStatus:
          type: string
          description: >
            Used to identify the *referrer* user's moderation status and affect
            Reward cancellation.
          enum:
            - PENDING
            - APPROVED
            - DENIED
          example: PENDING
        fraudSignals:
          $ref: '#/components/schemas/FraudSignals'
        dateReferralStarted:
          type: integer
          description: Timestamp of when this referral was started.
        dateReferralPaid:
          type: integer
          description: Timestamp of when this referral was marked as `PAID`.
        dateReferralEnded:
          type: integer
          description: Timestamp of when this referral was ended.
        dateModerated:
          type: integer
          description: Timestamp of when this referral was last moderated.
      type: object
      example:
        id: 546270a6e4b0c1871186a920
        referredUser:
          $ref: '#/components/schemas/User/example'
        referrerUser:
          $ref: '#/components/schemas/User/example'
        referredReward:
          $ref: '#/components/schemas/Reward/example/PCT_DISCOUNT'
        referrerReward:
          $ref: '#/components/schemas/Reward/example/PCT_DISCOUNT'
        referralCodeUsed: LORETTABURKE10
        shareLinkUsed: http://ssqt.co/mPbcF5
        moderationStatus: ACTIONED
        dateReferralStarted: 1415737510411
        dateReferralPaid: 1415737557217
        dateReferralEnded: null
        dateModerated: 1427410131029
        referredModerationStatus: APPROVED
        referrerModerationStatus: APPROVED
        fraudSignals:
          ip:
            message: Referrer and referred came from the same IP
            score: 50
