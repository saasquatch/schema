                #Congratulations
                Your friend has signed up for a {{companyName}} Account!
              bodyContent: >-
                You have now earned ${{math
                programDetails.referrerRewardDetails.credit ' / 100'}} of free
                credit with {{companyName}}. Refer more friends to save even
                more!
          REFERRAL_STARTED:
            configuration:
              fromName: '{{companyName}}'
              fromAddress: referral@mail.saasquat.ch
              subject: >-
                ​{{stringEmptyHandler newReferral.referredUser.firstName
                onEmpty='A friend'}}​ helped you get one step closer to free
                credit with {{companyName}}​!
              themeMapping: emails/referral-started
            content:
              shareCTA: >-
                Keep sharing your code and earn more discounts -
                **{{user.referralCode}}**
              hasShareLink: true
              shareButtonHeader: >-
                Refer and Earn ${{math
                programDetails.referrerRewardDetails.credit ' / 100'}} of Credit
              headerImageUrl: '{{assets ''images/email/referral-started-header.png''}}'
              headerContent: >-
                #Good News!

                Your friend has signed up for a free account with
                {{companyName}}!
              bodyContent: >-
                {{stringEmptyHandler newReferral.referredUser.firstName
                onEmpty='A friend'}}​ is currently trying out {{companyName}}.
                As a thank you from us, if they become a paying user, you will
                automatically receive ${{math
                programDetails.referrerRewardDetails.credit ' / 100'}} of free
                credit with {{companyName}}
    ThemeContext:
      description: >-
        The context object provided to themes for rendering the current user's
        widget.
      properties:
        tenantAlias:
          type: string
          description: The active tenant's alias
          example: abdsds5124abewet
        companyName:
          type: string
          description: The name of the company for the referral program
          example: Acme Corp
        programDetails:
          type: object
          description: The details of the incentives used for the referral program.
          properties:
            referredRewardDetails:
              $ref: '#/components/schemas/RewardTemplate'
            referrerRewardDetails:
              $ref: '#/components/schemas/RewardTemplate'
        user:
          $ref: '#/components/schemas/User'
        referrals:
          type: array
          description: The referrals made by the active user
          items:
            $ref: '#/components/schemas/ThemeReferrerReferralDto'
        referralsLength:
          type: integer
          description: The total number of referrals made by this user
        rewardBalances:
          type: array
          description: An array of reward balances for this user
          items:
            $ref: '#/components/schemas/RewardBalance'
        shareLinks:
          $ref: '#/components/schemas/Sharelink'
        referredBy:
          $ref: '#/components/schemas/ThemeReferredReferralDto'
        variables:
          $ref: '#/components/schemas/VariablesInstance'
        variablesSchema:
          $ref: '#/components/schemas/VariablesSchema'
        mode:
          type: string
          description: The mode the widget has been loaded in
          enum:
            - POPUP
            - EMBED
            - NOCONTENT
        assetVersion:
          type: string
          description: A unique hash used to version assets.
        headerVersion:
          type: string
          description: A unique version number used internally.
        newReferral:
          description: >-
            Details of a user who was referred by the current user (Available
            only in `REFERRAL_STARTED` email context)
        convertedReferral:
          description: >-
            Details of a user who was referred by the current user (Available
            only in `REFERRAL_CONVERTED` email context)
        locale:
          type: string
          description: >
            The user locale, used for
            [Internationalization](/themes/internationalization).

            The locale must be of the format `language_COUNTRY` where the
            language code must be lowercase and the country code must be
            uppercase.

            The separator must be an underscore.

            Examples `en` or `en_US` or `zh_CN`
      type: object
    OpenUser:
      description: An object describing an individual user returned by an open endpoint
      required:
        - id
        - accountId
        - firstName
      properties:
        id:
          type: string
          description: The unique identifier for this user.
          example: '219065'
        cookieId:
          type: string
          description: A unique identifier for this participant.
          example: '2523423436323'
        accountId:
          type: string
          description: The unique identifier of the Account that this user belongs to.
          example: accc9065
        firstName:
          type: string
          description: |
            The user's first name
          example: Bob
        lastName:
          type: string
          description: |
            The user's last name
          example: Testerson
        email:
          type: string
          description: >-
            The email address provided for the user. SaaSquatch uses this to
            notify someone when they have a successful referral.
          example: bob@example.com
        referralCode:
          type: string
          description: The referral code *used for sharing by this user*
          example: BOBTESTERSON
        referralCodes:
          type: object
          items:
            type: string
          description: >-
            The primary referral codes across all programs that the user
            currently has.
          properties: {}
          example:
            classic: BOBTESTERSON
            fakeProgram1: BOBTESTERSON123
        imageUrl:
          type: string
          description: >
            Optionally used in widgets, emails, and themes. If you provide a
            absolute profile image URL the minimum image size is 80px x 80px.
          example: https://www.example.com/profile/ab5111251125
        locale:
          type: string
          description: >
            The user's locale, used for
            [Internationalization](/themes/internationalization). The locale
            must be of the format 'language_COUNTRY' where the language code
            must be lowercase and the country code must be uppercase. The
            separator must be an underscore.
          example: en_US
        countryCode:
          type: string
          description: >-
            The user's ISO 3166-1 Alpha-2 country code. For example, "CA" for
            Canada and "ES" for Spain.
          example: US
        dateUsTaxFormSubmitted:
          type: integer
          description: >-
            The timestamp of when a users W-9 tax form was submitted. Used for
            [W-9 Compliance](/features/w-9-compliance).
          example: 1619647338270
        referredBy:
          type: object
          description: An object containing information about who referred this user.
          properties:
            code:
              type: string
              description: The referral code of the person that referred this account.
              example: JONDOE1234
            isConverted:
              type: boolean
              description: >-
                Whether or not this referred user has hit to goal post and the
                referral should be converted to kick of reward creation for the
                referrer.
              example: true
            newlyReferred:
              type: boolean
              description: Whether or not this referred user was referred recently.
              example: true
        referredByCodes:
          type: array
          items:
            type: string
          description: An array of referral codes used to refer this account.
        referable:
          type: boolean
          description: >-
            Flag used by the SaaSquatch system to determine whether a user is
            able to be referred.
          example: true
        customFields:
          type: object
          description: >
            An object containing the custom fields for this user.


            Learn more about the available custom field functionality in our
            [Custom Fields Developer Guide](/features/custom-user-fields)
          properties: {}
        segments:
          type: array
          items:
            type: string
          description: A list of segments that a user is a member of.
        shareLinks:
          $ref: '#/components/schemas/Sharelink'
        programShareLinks:
          $ref: '#/components/schemas/ProgramShareLink'
      type: object
      example:
        id: '898746321'
        cookieId: '2523423436323'
        accountId: accc9065
        firstName: Bob
        lastName: Testerson
        email: bob@example.com
        referable: true
        locale: null
        countryCode: US
        dateUsTaxFormSubmitted: 1619647338270
        referralCode: BOBTESTERSON
        referralCodes:
          classic: BOBTESTERSON
          fakeProgram1: FREE
        referredBy:
          code: JONDOE1234
          isConverted: true
          newlyReferred: false
        referredByCodes:
          - JONDOE1234
        imageUrl: ''
        customFields:
          lastPurchaseDate: 1512152525513
          plan: Pro+
          phone: 19055551234
          address: 123 Main st., City, Province, Country, H0H0H0
          shoeSize: 12.5
          currency: CAD
        segments:
          - segment1
          - segment3
        shareLinks:
          $ref: '#/components/schemas/Sharelink/example'
        programShareLinks:
          $ref: '#/components/schemas/ProgramShareLink/example'
