    ListEnvelope:
      description: >-
        A generic base model to help with paginating lists. The `count` counts
        the number in this list, and `totalCount` gives the total available
        results.
      properties:
        count:
          type: integer
          description: >-
            The number of results returned in this list, see `totalCount` for
            all rows.
        totalCount:
          type: integer
          description: >-
            The total number of results available overall, see `count` for the
            number of rows in this list.
      type: object
    UserList:
      type: object
      description: >-
        A list of User objects as `users`, with the fields `count` and
        `totalCount` to help with pagination.
      properties:
        count:
          type: integer
          description: >-
            The number of results returned in this list, see `totalCount` for
            all rows.
        totalCount:
          type: integer
          description: >-
            The total number of results available overall, see `count` for the
            number of rows in this list.
        users:
          type: array
          description: >-
            A list of User objects. This is the actual data in this list
            envelope.
          items:
            $ref: '#/components/schemas/User'
    ReferralList:
      type: object
      description: >-
        A list of Referral objects as `referrals`, with the fields `count` and
        `totalCount` to help with pagination.
      properties:
        count:
          type: integer
          description: >-
            The number of results returned in this list, see `totalCount` for
            all rows.
        totalCount:
          type: integer
          description: >-
            The total number of results available overall, see `count` for the
            number of rows in this list.
        referrals:
          type: array
          description: >-
            A list of Referral objects. This is the actual data in this list
            envelope.
          items:
            $ref: '#/components/schemas/Referral'
    PIIReferralList:
      type: object
      description: >-
        A list of Referral objects as `referrals`, with the fields `count` and
        `totalCount` to help with pagination.
      properties:
        referrals:
          type: array
          description: >-
            A list of Referral objects. This is the actual data in this list
            envelope.
          items:
            $ref: '#/components/schemas/PIIReferral'
        count:
          type: integer
          description: >-
            The number of results returned in this list, see `totalCount` for
            all rows.
        totalCount:
          type: integer
          description: >-
            The total number of results available overall, see `count` for the
            number of rows in this list.
    RewardDebitResponse:
      description: Details about a successful Reward Balance Debit transaction.
      properties:
        creditRedeemed:
          type: integer
          description: The amount of credit that was just debitted.
          example: 200
        creditAvailable:
